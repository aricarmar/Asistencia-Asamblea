name: Probar y publicar (web + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

env:
  # Dirección de la API en Render. Se configura en Settings > Secrets and variables > Actions > Variables > API_URL
  API_URL: ${{ vars.API_URL || 'https://asistencia-asamblea-api.onrender.com' }}
  # Dirección de la página web (para el código QR de "Compartir la app")
  WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  api:
    name: Pruebas de la API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asistencia_prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/asistencia_prueba

  web:
    name: Compilar web
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Crea las carpetas de Android y web que falten (no reemplaza las que ya existen).
      - run: flutter create --platforms=android,web --org co.asamblea --project-name asistencia_asamblea .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" --dart-define=API_URL=$API_URL --dart-define=WEB_URL=$WEB_URL
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web

  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Guarda las herramientas de Android para no descargarlas cada vez.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter create --platforms=android,web --org co.asamblea --project-name asistencia_asamblea .
      - run: flutter pub get
      # Si el servidor de descargas de Android dice "Too Many Requests", espera y reintenta.
      - name: Compilar APK (con reintentos)
        run: |
          for intento in 1 2 3 4; do
            if flutter build apk --release --dart-define=API_URL=$API_URL --dart-define=WEB_URL=$WEB_URL; then
              exit 0
            fi
            echo "Intento $intento falló. Esperando 90 segundos para reintentar..."
            sleep 90
          done
          exit 1
      - name: Ponerle nombre al APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/asamblea-trebolis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/asamblea-trebolis.apk

  publicar:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: [web, apk]
    # La página se publica aunque el APK falle; en ese caso queda sin el archivo de descarga.
    if: ${{ always() && needs.web.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: sitio
      - uses: actions/download-artifact@v4
        if: ${{ needs.apk.result == 'success' }}
        with:
          name: apk
          path: apk
      - name: Poner el APK dentro de la página web
        if: ${{ needs.apk.result == 'success' }}
        run: |
          mkdir -p sitio/descargas
          cp apk/asamblea-trebolis.apk sitio/descargas/asamblea-trebolis.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
