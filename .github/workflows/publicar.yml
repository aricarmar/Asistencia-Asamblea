name: Probar y publicar (web + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

env:
  # Dirección de la API en Render. Se configura en Settings > Secrets and variables > Actions > Variables > API_URL
  API_URL: ${{ vars.API_URL || 'https://asistencia-asamblea-api.onrender.com' }}

jobs:
  api:
    name: Pruebas de la API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asistencia_prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/asistencia_prueba

  app:
    name: Compilar web y APK
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Crea las carpetas de Android y web que falten (no reemplaza las que ya existen).
      - run: flutter create --platforms=android,web --org co.asamblea --project-name asistencia_asamblea .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_URL=$API_URL
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_URL=$API_URL
      - name: Poner el APK dentro de la página web
        run: |
          mkdir -p build/web/descargas
          cp build/app/outputs/flutter-apk/app-release.apk build/web/descargas/asistencia-asamblea.apk
      - uses: actions/upload-artifact@v4
        with:
          name: asistencia-asamblea-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  publicar:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: app
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
