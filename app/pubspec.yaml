name: asistencia_asamblea
description: "Asistencia a la asamblea de Trebolis Capellanía Centro Comercial."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Fuente incluida en la app para que se vea igual sin internet.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fuentes/Inter-Regular.otf
        - asset: assets/fuentes/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fuentes/Inter-Bold.otf
          weight: 700
        - asset: assets/fuentes/Inter-ExtraBold.otf
          weight: 800
